name: Setup
description: Checkout-adjacent toolchain setup shared by every CI job.

# GitHub Actions does not support YAML anchors, so without this composite action the same four
# steps would be copy-pasted into seven jobs. That is not merely verbose: it is how the Node
# version in job 5 quietly drifts away from the Node version in job 1, and a gate that runs on a
# different toolchain than the one it is guarding proves less than it appears to.

inputs:
  postgres:
    description: "Start the mas-radar-pg container (the DB-backed jobs need it, static does not)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        # Known divergence from the maintainer's machine (Node 26 locally). Pinned to the
        # current LTS because that is what the runner offers reliably; if a Node-version
        # specific bug ever appears, this line is the first place to look.
        node-version: 22
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    # GitHub Actions' built-in `services:` Postgres is NOT used, on purpose. Under
    # MAS_PG_RUNTIME=docker (set in the workflow-level env of ci.yml, inherited here)
    # scripts/db/ensure.ts starts its own throwaway `mas-radar-pg` container bound to
    # 127.0.0.1:5432, and a service container would already own that port — the two would
    # collide. The operator machine no longer runs Docker: there ensure.ts (MAS_PG_RUNTIME unset =
    # native) only probes the native PostgreSQL 16 service and never creates anything. Without the
    # workflow env this step would take that native path and fail on a runner with no Postgres.
    - name: Start PostgreSQL (throwaway CI container, MAS_PG_RUNTIME=docker)
      if: inputs.postgres == 'true'
      shell: bash
      run: pnpm db:ensure
